openapi: 3.1.0
info:
  title: Yap Algorithm recommendation contract
  version: 0.1.0
  description: Core feed and telemetry contract. Content mutation routes are documented in README.md.
servers:
  - url: http://127.0.0.1:8090
security:
  - bearer: []
paths:
  /v1/feed:
    get:
      operationId: getFeed
      parameters:
        - {name: tab, in: query, schema: {type: string, enum: [for_you, friends, nearby], default: for_you}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 30, default: 20}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 1000}, description: Opaque; reuse the same tab and limit.}
      responses:
        '200':
          description: Visible items, with final authorization rechecked.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Page'}
        '409': {description: Preferences changed; begin a new session.}
        '410': {description: Session expired; begin a new session.}
        default: {$ref: '#/components/responses/Error'}
  /v1/events:batch:
    post:
      operationId: recordEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: {$ref: '#/components/schemas/Event'}
      responses:
        '204': {description: Accepted, including idempotent retries.}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, description: Supabase access token; local fixtures use dev UUID tokens.}
  responses:
    Error:
      description: JSON error. 401 invalid authentication; 403 denied; 429 throttled; 503 temporary unavailability.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}
  schemas:
    Post:
      type: object
      required: [id, author_id, text, audience, language, photos, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        author_id: {type: string, format: uuid}
        text: {type: string, maxLength: 5000}
        audience: {type: string, enum: [public, friends]}
        language: {type: string, enum: [ru, en]}
        photos: {type: array, maxItems: 3, items: {type: string}}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        precise_location:
          type: object
          description: Omitted unless current friendship and location permissions allow it.
          required: [latitude, longitude]
          properties:
            latitude: {type: number, minimum: -90, maximum: 90}
            longitude: {type: number, minimum: -180, maximum: 180}
    Page:
      type: object
      required: [session_id, items, expires_at, model]
      properties:
        session_id: {type: string, format: uuid}
        next_cursor: {type: string}
        expires_at: {type: string, format: date-time}
        model: {type: string}
        items:
          type: array
          maxItems: 30
          items:
            type: object
            required: [position, post, reasons]
            properties:
              position: {type: integer, minimum: 0}
              post: {$ref: '#/components/schemas/Post'}
              reasons: {type: array, items: {type: string}}
    Event:
      type: object
      additionalProperties: false
      required: [id, session_id, position, post_id, kind]
      properties:
        id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        position: {type: integer, minimum: 0, maximum: 2000}
        post_id: {type: string, format: uuid}
        kind: {type: string, enum: [impression, dwell, open_post, open_photo]}
        visible_ms: {type: integer, minimum: 0, maximum: 300000}
        visible_fraction: {type: number, minimum: 0, maximum: 1}
        active_ms: {type: integer, minimum: 0, maximum: 120000}
      allOf:
        - if: {properties: {kind: {const: impression}}}
          then:
            required: [visible_ms, visible_fraction]
            properties:
              visible_ms: {minimum: 1000}
              visible_fraction: {minimum: 0.5}
        - if: {properties: {kind: {const: dwell}}}
          then:
            required: [active_ms]
            properties:
              active_ms: {minimum: 1000}

openapi: 3.1.0
info:
  title: YapChat Supabase personalized feed
  version: 1.7.0
  description: Internal worker has no client listener. Use these RPCs through the existing Supabase SDK and account
    session. UUIDs and versions must survive network retries. Serialize settings mutations; post actions additionally
    enforce optimistic action_version. Internal vectors and scores are never returned.
servers:
- {url: 'http://127.0.0.1:54321'}
security:
- apiKey: []
  bearer: []
paths:
  /rest/v1/rpc/get_for_you_feed_v2:
    post:
      operationId: getForYouFeedV2
      description: Create one UUID per refresh and reuse it on retries. For subsequent calls keep the session UUID
        and pass next_cursor as requested_cursor. Keep the page size unchanged when retrying the same cursor.
        An empty page with status continue has a new cursor. An exhausted page has no cursor and can contain
        the final items. A session expires after 20 minutes idle or when superseded by opening a fifth session.
        After expiry or an interests reset, generate a new session UUID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requested_session]
              properties:
                requested_session: {type: string, format: uuid}
                requested_cursor: {type: [string, 'null'], format: uuid, default: null}
                requested_limit: {type: integer, minimum: 1, maximum: 30, default: 20}
      responses:
        '200':
          description: Stable page or checkpoint, with current access applied.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScrollPage'}
        default: {$ref: '#/components/responses/RPCError'}
  /rest/v1/rpc/get_for_you_feed:
    post:
      operationId: getForYouFeed
      description: First page omits requested_session and uses after_position=-1. Continue with next_cursor values.
        A session's order is immutable; current access is rechecked on every page. After a reset/expiry start a
        new session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                requested_session:
                  type: [string, 'null']
                  format: uuid
                  default: null
                after_position: {type: integer, minimum: -1, maximum: 199, default: -1}
                requested_limit: {type: integer, minimum: 1, maximum: 30, default: 20}
      responses:
        '200':
          description: Visible page, including fallback while the worker is unavailable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeedPage'}
        default: {$ref: '#/components/responses/RPCError'}
  /rest/v1/rpc/record_feed_events:
    post:
      operationId: recordFeedEvents
      description: Send impression before dwell/open_post. Each impression needs at least 1000ms and 50% visibility;
        server elapsed time must also allow it. Dwell active_ms is cumulative for a delivery, capped at 120000,
        not a delta. Store event_id and the unchanged body until acknowledgement. Stale epochs/text versions and
        expired owned deliveries are ignored. Unknown or foreign deliveries are validation errors and roll back
        the batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requested_events]
              additionalProperties: false
              properties:
                requested_events:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: {$ref: '#/components/schemas/Event'}
      responses:
        '200':
          description: Counts of accepted, duplicate and stale events, and current user revision.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, duplicates, stale, revision]
                properties:
                  accepted: {type: integer}
                  duplicates: {type: integer}
                  stale: {type: integer}
                  revision: {type: integer, format: int64}
        default: {$ref: '#/components/responses/RPCError'}
  /rest/v1/rpc/apply_feed_action:
    post:
      operationId: applyFeedAction
      description: Use delivery_id from a served post and expected_version=post.action_version. New user intent
        gets a new requested_id. A transport retry reuses the exact original ID/body/version. A 409 version conflict
        needs reconciliation with current server state; never replay an older intent with a newer version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requested_id, requested_delivery, requested_action, expected_version]
              properties:
                requested_id: {type: string, format: uuid}
                requested_delivery: {type: string, format: uuid}
                requested_action:
                  type: string
                  enum: [like, unlike, less_similar, undo_less_similar]
                expected_version: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          description: Action result; ignore replies older than the cached action_version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActionResult'}
        default: {$ref: '#/components/responses/RPCError'}
  /rest/v1/rpc/set_recommendation_author_hidden:
    post:
      operationId: setRecommendationAuthorHidden
      description: Hiding applies to recommendations only; it is separate from a user block.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requested_id, requested_author, requested_hidden]
              properties:
                requested_id: {type: string, format: uuid}
                requested_author: {type: string, format: uuid}
                requested_hidden: {type: boolean}
      responses:
        '200': {description: 'request_id, changed, hidden, replayed and user revision.'}
        default: {$ref: '#/components/responses/RPCError'}
  /rest/v1/rpc/reset_recommendation_interests:
    post:
      operationId: resetRecommendationInterests
      description: Advances the interest epoch, invalidating old sessions and delayed telemetry. Preserves explicit
        hidden authors, blocks and visible likes. Clears chosen topics. Retry with the same requested_id to avoid
        performing another reset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requested_id]
              additionalProperties: false
              properties:
                requested_id: {type: string, format: uuid}
      responses:
        '200': {description: 'request_id, epoch, revision and replayed.'}
        default: {$ref: '#/components/responses/RPCError'}
  /rest/v1/rpc/get_recommendation_topics:
    post:
      operationId: getRecommendationTopics
      description: Reads the localized catalog and the signed-in viewer's optional choice. Refresh this state
        after a conflict or interest reset. Quota is 60 reads per minute and 1000 per UTC day.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                requested_language: {type: string, enum: [ru, en], default: ru}
      responses:
        '200':
          description: Active catalog and viewer state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TopicCatalog'}
        default: {$ref: '#/components/responses/RPCError'}
  /rest/v1/rpc/set_recommendation_topics:
    post:
      operationId: setRecommendationTopics
      description: Replaces the unordered selection. An empty array skips or clears it. Use the observed epoch,
        selection version and catalog version. Retry with the same UUID and body. Retain the newest response by
        epoch and version. A 409 requires reconciliation before submitting a new user intent. Quota is 12 writes
        per minute and 120 per UTC day, including retries. Reading the feed requires no topic selection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requested_id, expected_epoch, expected_version, requested_catalog_version, requested_topics]
              properties:
                requested_id: {type: string, format: uuid}
                expected_epoch: {type: integer, minimum: 1}
                expected_version: {type: integer, format: int64, minimum: 0}
                requested_catalog_version: {type: integer, minimum: 1}
                requested_topics: {$ref: '#/components/schemas/TopicIDs'}
      responses:
        '200':
          description: Stored intent receipt.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/TopicSelection'}
                  - type: object
                    required: [request_id, catalog_version, replayed]
                    properties:
                      request_id: {type: string, format: uuid}
                      catalog_version: {type: integer, minimum: 1}
                      replayed: {type: boolean}
        '409': {$ref: '#/components/responses/RPCError'}
        default: {$ref: '#/components/responses/RPCError'}
  /rest/v1/rpc/get_recommendation_hidden_authors:
    post:
      operationId: getRecommendationHiddenAuthors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                after_author:
                  type: [string, 'null']
                  format: uuid
                  default: null
                requested_limit: {type: integer, minimum: 1, maximum: 100, default: 30}
      responses:
        '200':
          description: Keyset page of the caller's explicitly hidden author IDs.
          content:
            application/json:
              schema:
                type: object
                required: [author_ids, next_cursor]
                properties:
                  author_ids:
                    type: array
                    items: {type: string, format: uuid}
                  next_cursor:
                    type: [string, 'null']
                    format: uuid
        default: {$ref: '#/components/responses/RPCError'}
  /rest/v1/rpc/reserve_feed_photo:
    post:
      operationId: reserveFeedPhoto
      description: Reserve before uploading. Reuse post/photo UUID and unchanged size/MIME on retry. Max 3 slots/draft,
        4 active drafts/user, 48 new reservations/sliding hour; draft expires in 1h. Standard Storage upload, exact
        bytes/MIME, upsert=false. No signed upload, originals download, copy/move/delete. JPEG/PNG only, 5MiB, max
        8192 per edge and 20MP decoded. Separate 60/min quota per media operation. Global admission also bounds
        outstanding upload promises, queued work, reserved bytes and temporary Storage debt. On 429 retry after
        Retry-After seconds with jitter, preserving UUIDs and parameters. Exact retries of a valid reservation,
        confirmation, status and cancellation remain available while admission is paused. Expired drafts require
        new UUIDs; reserve/confirm/publish return PT410 photo_reservation_expired.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requested_post, requested_photo, requested_bytes, requested_mime]
              properties:
                requested_post: {type: string, format: uuid}
                requested_photo: {type: string, format: uuid}
                requested_bytes: {type: integer, minimum: 1, maximum: 5242880}
                requested_mime:
                  type: string
                  enum: [image/jpeg, image/png]
              additionalProperties: false
      responses:
        '200':
          description: Successful checked RPC.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PhotoReservation'}
        '429':
          description: New reservations temporarily rejected; code media_capacity_exceeded, message media_temporarily_busy.
          headers:
            Retry-After:
              description: Minimum delay in seconds before retrying, with jitter.
              schema: {type: integer, minimum: 1, maximum: 300}
          content:
            application/json:
              schema: {$ref: '#/components/responses/RPCError/content/application~1json/schema'}
        '410': {$ref: '#/components/responses/RPCError'}
        default: {$ref: '#/components/responses/RPCError'}
  /rest/v1/rpc/confirm_feed_photo:
    post:
      operationId: confirmFeedPhoto
      description: After Storage upload, check actual metadata/ownership and queue validation. Idempotent. Poll
        status with backoff until ready.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requested_photo]
              properties:
                requested_photo: {type: string, format: uuid}
              additionalProperties: false
      responses:
        '200':
          description: Successful checked RPC.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PhotoStatus'}
        default: {$ref: '#/components/responses/RPCError'}
  /rest/v1/rpc/get_feed_photo_status:
    post:
      operationId: getFeedPhotoStatus
      description: Owner-only. Keep local preview and poll with backoff. Rejected content requires a corrected new
        draft; failed processing requires operator recovery. Expiration applies even if the last returned state
        was ready.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requested_post]
              properties:
                requested_post: {type: string, format: uuid}
              additionalProperties: false
      responses:
        '200':
          description: Successful checked RPC.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DraftStatus'}
        default: {$ref: '#/components/responses/RPCError'}
  /rest/v1/rpc/cancel_feed_draft:
    post:
      operationId: cancelFeedDraft
      description: Idempotently cancel an unpublished draft. Access is revoked immediately; physical cleanup is
        asynchronous.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requested_post]
              properties:
                requested_post: {type: string, format: uuid}
              additionalProperties: false
      responses:
        '200':
          description: Successful checked RPC.
          content:
            application/json:
              schema: {type: 'null'}
        default: {$ref: '#/components/responses/RPCError'}
        '204': {description: Success; no body.}
  /rest/v1/rpc/publish_feed_post:
    post:
      operationId: publishFeedPost
      description: Publish selected ready photos using the reserved draft ID. Photo array order is permanent. Empty
        text requires a photo. Optional location belongs to the publication, independent of nearby people visibility.
        Max 12 new posts/sliding hour, including soft-deleted. A transport retry preserves original ID and full
        body, including photo order/location.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requested_id]
              properties:
                requested_id: {type: string, format: uuid}
                requested_text: {type: string, maxLength: 1000, default: ''}
                requested_audience:
                  type: string
                  enum: [public, friends]
                  default: public
                requested_language:
                  type: string
                  enum: [ru, en]
                  default: ru
                requested_photos:
                  type: array
                  maxItems: 3
                  uniqueItems: true
                  items: {type: string, format: uuid}
                  default: []
                requested_location:
                  oneOf:
                  - {type: 'null'}
                  - type: object
                    required: [latitude, longitude]
                    properties:
                      latitude: {type: number, minimum: -90, maximum: 90}
                      longitude: {type: number, minimum: -180, maximum: 180}
                    additionalProperties: false
                  default: null
              additionalProperties: false
      responses:
        '200':
          description: Successful checked RPC.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PostBase'}
        default: {$ref: '#/components/responses/RPCError'}
  /rest/v1/rpc/create_feed_post:
    post:
      operationId: createFeedPost
      description: Compatible text-only RPC. Use publish_feed_post for photos/location. A transport retry reuses
        original ID/body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requested_id, requested_text]
              properties:
                requested_id: {type: string, format: uuid}
                requested_text: {type: string, maxLength: 1000, minLength: 1}
                requested_audience:
                  type: string
                  enum: [public, friends]
                  default: public
                requested_language:
                  type: string
                  enum: [ru, en]
                  default: ru
              additionalProperties: false
      responses:
        '200':
          description: Successful checked RPC.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PostBase'}
        default: {$ref: '#/components/responses/RPCError'}
  /rest/v1/rpc/edit_feed_post:
    post:
      operationId: editFeedPost
      description: Edit text only. Empty text requires an attached photo. On 40001/post_version_conflict refetch;
        never silently replay old intent with a new version. Photos and publication location remain fixed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requested_id, expected_version, requested_text]
              properties:
                requested_id: {type: string, format: uuid}
                expected_version: {type: integer, minimum: 1}
                requested_text: {type: string, maxLength: 1000}
              additionalProperties: false
      responses:
        '200':
          description: Successful checked RPC.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PostBase'}
        default: {$ref: '#/components/responses/RPCError'}
  /rest/v1/rpc/delete_feed_post:
    post:
      operationId: deleteFeedPost
      description: Idempotently soft-delete own post. Media access is revoked immediately; physical cleanup is asynchronous.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requested_id]
              properties:
                requested_id: {type: string, format: uuid}
              additionalProperties: false
      responses:
        '200':
          description: Successful checked RPC.
          content:
            application/json:
              schema: {type: 'null'}
        default: {$ref: '#/components/responses/RPCError'}
        '204': {description: Success; no body.}
  /rest/v1/rpc/get_feed_post:
    post:
      operationId: getFeedPost
      description: Checked direct read; null if unavailable. Supplies a direct delivery for feedback. Authors hidden
        from recommendations remain directly accessible if otherwise permitted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requested_id]
              properties:
                requested_id: {type: string, format: uuid}
              additionalProperties: false
      responses:
        '200':
          description: Successful checked RPC.
          content:
            application/json:
              schema:
                oneOf:
                - {type: 'null'}
                - {$ref: '#/components/schemas/DirectPost'}
        default: {$ref: '#/components/responses/RPCError'}
  /rest/v1/rpc/create_feed_comment:
    post:
      operationId: create_feed_comment
      description: Up to 200 Unicode characters; nonblank. requested_reply_to may address a root or any reply in
        that same post. Retry with the identical UUID and body. 30 new comments/minute, 500/day; retries do not
        consume the creation allowance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - requested_id
              - requested_post
              - requested_text
              properties:
                requested_id:
                  type: string
                  format: uuid
                requested_post:
                  type: string
                  format: uuid
                requested_text:
                  type: string
                  minLength: 1
                  maxLength: 200
                requested_reply_to:
                  oneOf:
                  - type: 'null'
                  - type: string
                    format: uuid
                  default: null
      responses:
        '200':
          description: Current result or safe acknowledgement for an identical request retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        default:
          $ref: '#/components/responses/RPCError'
  /rest/v1/rpc/edit_feed_comment:
    post:
      operationId: edit_feed_comment
      description: Owner only; optimistic content version. New intent gets a new UUID; retry preserves body and
        ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - requested_id
              - requested_comment
              - expected_version
              - requested_text
              properties:
                requested_id:
                  type: string
                  format: uuid
                requested_comment:
                  type: string
                  format: uuid
                expected_version:
                  type: integer
                  minimum: 1
                requested_text:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        '200':
          description: Current result or safe acknowledgement for an identical request retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentMutation'
        default:
          $ref: '#/components/responses/RPCError'
  /rest/v1/rpc/delete_feed_comment:
    post:
      operationId: delete_feed_comment
      description: Owner only; leaves a tombstone and preserves flat replies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - requested_id
              - requested_comment
              - expected_version
              properties:
                requested_id:
                  type: string
                  format: uuid
                requested_comment:
                  type: string
                  format: uuid
                expected_version:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Current result or safe acknowledgement for an identical request retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentMutation'
        default:
          $ref: '#/components/responses/RPCError'
  /rest/v1/rpc/set_feed_comment_liked:
    post:
      operationId: set_feed_comment_liked
      description: Set desired state, never toggle blindly. expected_version is the current comment action_version;
        also send both observed content versions. Reconcile HTTP 409 before a new intent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - requested_id
              - requested_comment
              - requested_liked
              - expected_version
              - expected_comment_version
              - expected_post_version
              properties:
                requested_id:
                  type: string
                  format: uuid
                requested_comment:
                  type: string
                  format: uuid
                requested_liked:
                  type: boolean
                expected_version:
                  type: integer
                  minimum: 0
                expected_comment_version:
                  type: integer
                  minimum: 1
                expected_post_version:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Current result or safe acknowledgement for an identical request retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentReaction'
        default:
          $ref: '#/components/responses/RPCError'
  /rest/v1/rpc/get_feed_comments:
    post:
      operationId: get_feed_comments
      description: Pages live 20 minutes. Omit requested_session and use after_position=-1 for a new page session.
        Continue using next_cursor and the same page size/context. Issued page IDs replay unchanged; remaining roots
        are chosen by current popularity without duplicates, not a frozen global ranking. New comments after session
        creation require a new session. Current bans/deletion/blocks always mask content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - requested_post
              properties:
                requested_post:
                  type: string
                  format: uuid
                requested_root:
                  description: When set, requested_sort must be old; prefer get_feed_comment_replies.
                  oneOf:
                  - type: 'null'
                  - type: string
                    format: uuid
                  default: null
                requested_sort:
                  type: string
                  enum:
                  - popular
                  - old
                  - new
                  default: popular
                requested_session:
                  oneOf:
                  - type: 'null'
                  - type: string
                    format: uuid
                  default: null
                after_position:
                  type: integer
                  minimum: -1
                  default: -1
                requested_limit:
                  type: integer
                  minimum: 1
                  maximum: 30
                  default: 20
      responses:
        '200':
          description: Current result or safe acknowledgement for an identical request retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
        default:
          $ref: '#/components/responses/RPCError'
  /rest/v1/rpc/get_feed_comment_replies:
    post:
      operationId: get_feed_comment_replies
      description: Pages live 20 minutes. Omit requested_session and use after_position=-1 for a new page session.
        Continue using next_cursor and the same page size/context. Issued page IDs replay unchanged; remaining roots
        are chosen by current popularity without duplicates, not a frozen global ranking. New comments after session
        creation require a new session. Current bans/deletion/blocks always mask content. Replies are chronological,
        oldest first. No nested reply pages.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - requested_post
              - requested_root
              properties:
                requested_post:
                  type: string
                  format: uuid
                requested_root:
                  type: string
                  format: uuid
                requested_session:
                  oneOf:
                  - type: 'null'
                  - type: string
                    format: uuid
                  default: null
                after_position:
                  type: integer
                  minimum: -1
                  default: -1
                requested_limit:
                  type: integer
                  minimum: 1
                  maximum: 30
                  default: 20
      responses:
        '200':
          description: Current result or safe acknowledgement for an identical request retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
        default:
          $ref: '#/components/responses/RPCError'
  /rest/v1/rpc/get_friends_feed:
    post:
      operationId: get_friends_feed
      description: All current mutual friends and explicitly followed authors, reverse chronology, including their accessible plain reposts and quotes; deduplicate
        original IDs. Stable issued pages, 20-minute session, maximum 30/page. Current friendship and content access
        are rechecked. Interest reset invalidates the session (409). Feed receipts use surface friends and the existing
        telemetry/action RPCs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: []
              properties:
                requested_session:
                  oneOf:
                  - type: 'null'
                  - type: string
                    format: uuid
                  default: null
                after_position:
                  type: integer
                  minimum: -1
                  default: -1
                requested_limit:
                  type: integer
                  minimum: 1
                  maximum: 30
                  default: 20
      responses:
        '200':
          description: Current result or safe acknowledgement for an identical request retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendsPage'
        default:
          $ref: '#/components/responses/RPCError'
  /rest/v1/rpc/get_nearby_feed:
    post:
      operationId: get_nearby_feed
      description: >-
        Chronological explicit publication geotags within 1..50 km of the caller's location updated within 12 hours.
        No ML dependency. Seven-day publication window; private origin fixed for a 20-minute session. At most 2000
        spatial candidates examined per page. An empty page can have has_more=true; always use next_cursor to continue.
        Replays preserve issued IDs and recheck current blocks, bans, audience and original access. Coordinates follow
        existing friend permissions. Follow alone grants no private audience or precise location. Separate 60 reads/minute
        quota; code 42901. Missing/stale own location returns 412 nearby_location_required. Reset invalidates session (409).
        Receipts use surface nearby and common telemetry/action RPCs; no origin coordinates are returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                requested_session:
                  type: [string, 'null']
                  format: uuid
                  default: null
                after_position: {type: integer, minimum: -1, default: -1}
                requested_limit: {type: integer, minimum: 1, maximum: 30, default: 20}
                requested_radius_km: {type: integer, minimum: 1, maximum: 50, default: 50}
      responses:
        '200':
          description: Bounded chronological page; continue even after empty items when has_more is true.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NearbyPage'}
        default:
          $ref: '#/components/responses/RPCError'
  /rest/v1/rpc/create_feed_repost:
    post:
      operationId: create_feed_repost
      description: Empty text creates a plain reference without a new post or embedding; nonempty text creates a
        quote post with its own caption embedding and live original. One active plain repost per author/original.
        At most four reference edges. Posts, quotes and plain reposts share 12 creations/hour; deletion does not
        restore allowance. Quotes have no own photos in this version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - requested_id
              - requested_original
              properties:
                requested_id:
                  type: string
                  format: uuid
                requested_original:
                  type: string
                  format: uuid
                requested_text:
                  type: string
                  maxLength: 1000
                  default: ''
                requested_audience:
                  type: string
                  enum:
                  - public
                  - friends
                  default: public
                requested_language:
                  type: string
                  enum:
                  - ru
                  - en
                  default: ru
      responses:
        '200':
          description: Current result or safe acknowledgement for an identical request retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepostResult'
        default:
          $ref: '#/components/responses/RPCError'
  /rest/v1/rpc/delete_feed_repost:
    post:
      operationId: delete_feed_repost
      description: Undo the owned repost using its ID/version (my_repost for a plain repost). Also soft-deletes
        a quote post. Idempotent request UUID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - requested_id
              - requested_repost
              - expected_version
              properties:
                requested_id:
                  type: string
                  format: uuid
                requested_repost:
                  type: string
                  format: uuid
                expected_version:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Current result or safe acknowledgement for an identical request retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentMutation'
        default:
          $ref: '#/components/responses/RPCError'
  /rest/v1/rpc/submit_feed_content_report:
    post:
      operationId: submit_feed_content_report
      description: 'Existing private moderator queue with a content snapshot. Sender hides target; no automatic
        global ban. Separate limits: posts 20/day, comments 30/day, each 5/minute; same target cooldown seven days.
        User reports keep their existing separate allowance. Reports on own content are rejected; comment reports
        are not negative semantic training labels.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - requested_id
              - requested_type
              - requested_content
              - requested_reason
              properties:
                requested_id:
                  type: string
                  format: uuid
                requested_type:
                  type: string
                  enum:
                  - post
                  - comment
                requested_content:
                  type: string
                  format: uuid
                requested_reason:
                  type: string
                  enum:
                  - spam
                  - scam
                  - pornography
                  - other
      responses:
        '200':
          description: Current result or safe acknowledgement for an identical request retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResult'
        default:
          $ref: '#/components/responses/RPCError'
  /rest/v1/rpc/set_feed_author_followed:
    post:
      operationId: set_feed_author_followed
      description: Set desired state with a new UUID per intent and expected_version from FollowState.version. Exact
        transport retries reuse UUID/body/version; old retries return their original acknowledgement without overwriting
        newer state. Ignore replies older than cached version and reconcile 409. Follow and friendship coexist independently.
        Block removes both follow directions and advances versions; unblock does not restore them. Limit 120 requests/minute,
        2000/day; new active follows additionally 30/minute and 500/day; maximum 10000 active follows. Daily counters
        use UTC. Uses existing application error code 42901; HTTP status alone is insufficient.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - requested_id
              - requested_author
              - requested_following
              - expected_version
              properties:
                requested_id:
                  type: string
                  format: uuid
                requested_author:
                  type: string
                  format: uuid
                requested_following:
                  type: boolean
                expected_version:
                  type: integer
                  format: int64
                  minimum: 0
      responses:
        '200':
          description: Current state, relation page or idempotent acknowledgement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowResult'
        default:
          $ref: '#/components/responses/RPCError'
  /rest/v1/rpc/get_feed_author_follow_state:
    post:
      operationId: get_feed_author_follow_state
      description: Read only the caller relationship to an existing target, including its version for reconciliation.
        120 requests/minute, independently of list and write quotas. Returns no target profile or location.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - requested_author
              properties:
                requested_author:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Current state, relation page or idempotent acknowledgement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowState'
        default:
          $ref: '#/components/responses/RPCError'
  /rest/v1/rpc/get_feed_following:
    post:
      operationId: get_feed_following
      description: Paginated active authors followed by requested_user (defaults to the caller). Public to authenticated
        users, subject to current blocks/bans/deletion. 60 requests/minute on the caller, independent of followers/state/write
        quotas. FollowPage defines ordering and next_cursor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: []
              properties:
                requested_user:
                  oneOf:
                  - type: 'null'
                  - type: string
                    format: uuid
                  default: null
                after_user:
                  oneOf:
                  - type: 'null'
                  - type: string
                    format: uuid
                  default: null
                requested_limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 30
      responses:
        '200':
          description: Current state, relation page or idempotent acknowledgement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowPage'
        default:
          $ref: '#/components/responses/RPCError'
  /rest/v1/rpc/get_feed_followers:
    post:
      operationId: get_feed_followers
      description: Paginated active followers of requested_user (defaults to the caller). Public to authenticated
        users, subject to current blocks/bans/deletion. Separate caller quota 60 requests/minute. No precision-location
        fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: []
              properties:
                requested_user:
                  oneOf:
                  - type: 'null'
                  - type: string
                    format: uuid
                  default: null
                after_user:
                  oneOf:
                  - type: 'null'
                  - type: string
                    format: uuid
                  default: null
                requested_limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 30
      responses:
        '200':
          description: Current state, relation page or idempotent acknowledgement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowPage'
        default:
          $ref: '#/components/responses/RPCError'
components:
  securitySchemes:
    apiKey: {type: apiKey, in: header, name: apikey}
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
  responses:
    RPCError:
      description: 'PostgREST error object: code/message/details/hint. PT409 with feed_action_version_conflict requires
        state reconciliation; PT409 feed_session_invalidated and PT410 feed_session_expired require a new session;
        PT404 is an unknown/foreign session. 23505 means request/event ID reused with different data. 22023 covers
        invalid/expired deliveries and malformed telemetry. 42901 is the application''s quota error code (do not
        rely on HTTP 429). Existing account-ban/deletion errors retain their shared YapChat contract. Network/503
        errors preserve the last permitted cache; they do not by themselves mean logout.'
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: {type: string}
              message: {type: string}
              details:
                type: [string, 'null']
              hint:
                type: [string, 'null']
  schemas:
    TopicIDs:
      type: array
      uniqueItems: true
      maxItems: 4
      items: {type: string, pattern: '^[a-z][a-z0-9_-]{0,31}$'}
    TopicSelection:
      type: object
      required: [epoch, version, status, topics]
      properties:
        epoch: {type: integer, minimum: 1}
        version: {type: integer, format: int64, minimum: 0}
        status: {type: string, enum: [not_set, skipped, selected]}
        topics: {$ref: '#/components/schemas/TopicIDs'}
    TopicCatalog:
      type: object
      required: [catalog_version, max_selected, topics, selection]
      properties:
        catalog_version: {type: integer, minimum: 1}
        max_selected: {type: integer, const: 4}
        topics:
          type: array
          maxItems: 64
          items:
            type: object
            required: [id, label]
            properties:
              id: {type: string}
              label: {type: string}
        selection: {$ref: '#/components/schemas/TopicSelection'}
    Post:
      allOf:
      - {$ref: '#/components/schemas/PostBase'}
      - type: object
        required: [action_version, liked]
        properties:
          action_version: {type: integer, format: int64, minimum: 0}
          liked: {type: boolean}
    ScrollPage:
      type: object
      required: [contract_version, session_id, expires_at, items, has_more, next_cursor, status]
      properties:
        contract_version: {type: integer, const: 2}
        session_id: {type: string, format: uuid}
        expires_at: {type: string, format: date-time}
        has_more: {type: boolean}
        next_cursor: {type: [string, 'null'], format: uuid}
        status: {type: string, enum: [page, continue, exhausted]}
        items:
          type: array
          maxItems: 30
          items:
            type: object
            required: [position, delivery_id, delivery_expires_at, post, reasons, model]
            properties:
              position: {type: integer, minimum: 0}
              delivery_id: {type: string, format: uuid}
              delivery_expires_at: {type: string, format: date-time}
              post: {$ref: '#/components/schemas/Post'}
              reasons:
                type: array
                items: {type: string}
              model: {type: string, description: Producing model per item. Archive items use archive-v2.}
    FeedPage:
      type: object
      required: [contract_version, session_id, items, next_cursor, has_more, expires_at, model, versions, refresh]
      properties:
        contract_version: {type: integer, const: 1}
        session_id: {type: string, format: uuid}
        items:
          type: array
          maxItems: 30
          items:
            type: object
            required: [position, delivery_id, delivery_expires_at, post, reasons]
            properties:
              position: {type: integer, minimum: 0, maximum: 199}
              delivery_id: {type: string, format: uuid}
              delivery_expires_at: {type: string, format: date-time}
              post: {$ref: '#/components/schemas/Post'}
              reasons:
                type: array
                items: {type: string}
                description: Stable reason IDs; ignore unfamiliar IDs.
        next_cursor:
          oneOf:
          - {type: 'null'}
          - type: object
            required: [session_id, after_position]
            properties:
              session_id: {type: string, format: uuid}
              after_position: {type: integer, minimum: 0, maximum: 199}
        has_more: {type: boolean}
        expires_at: {type: string, format: date-time}
        model: {type: string, description: fallback-v1 or personalized-v2; existing personalized-v1 sessions remain readable.}
        versions:
          type: object
          required: [features, policy, embedding_space]
          description: Actual producing snapshot versions; opaque IDs, preserve for diagnostics. A fallback has no semantic features.
          properties:
            features: {type: string}
            policy: {type: string}
            embedding_space: {type: string}
        refresh:
          type: object
          required: [status, revision, processed_revision, prepared_at]
          properties:
            status:
              type: string
              enum: [fresh, queued, retrying, failed]
            revision: {type: integer, format: int64}
            processed_revision: {type: integer, format: int64}
            prepared_at:
              type: [string, 'null']
              format: date-time
    Event:
      type: object
      additionalProperties: false
      required: [event_id, delivery_id, kind]
      properties:
        event_id: {type: string, format: uuid}
        delivery_id: {type: string, format: uuid}
        kind:
          type: string
          enum: [impression, dwell, open_post]
        visible_ms: {type: integer, minimum: 1000, maximum: 120000}
        visible_fraction: {type: number, minimum: 0.5, maximum: 1}
        active_ms: {type: integer, minimum: 0, maximum: 120000}
    ActionResult:
      type: object
      required: [request_id, changed, replayed, revision, action_version, liked, less_similar]
      properties:
        request_id: {type: string, format: uuid}
        changed: {type: boolean}
        replayed: {type: boolean}
        revision: {type: integer, format: int64}
        action_version: {type: integer, format: int64}
        liked: {type: boolean}
        less_similar: {type: boolean}
    PostBase:
      type: object
      required: [id, author_id, text, audience, language, version, created_at, updated_at, photos, location, is_repost, comment_count, repost_count, my_repost, reposted_by, author_relationship]
      properties:
        id: {type: string, format: uuid}
        author_id: {type: string, format: uuid}
        text: {type: string, maxLength: 1000}
        audience:
          type: string
          enum: [public, friends]
        language:
          type: string
          enum: [ru, en]
        version: {type: integer, minimum: 1, description: Content version distinct from action_version.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        photos:
          type: array
          maxItems: 3
          items: {$ref: '#/components/schemas/Photo'}
        location:
          oneOf:
          - {type: 'null'}
          - type: object
            required: [nearby]
            properties:
              nearby: {type: boolean}
              latitude: {type: number, minimum: -90, maximum: 90}
              longitude: {type: number, minimum: -180, maximum: 180}
            description: Exact coordinates only for the author or currently permitted friends; other viewers get
              only nearby=true within 50km. Viewer position older than 12h is ignored.
        is_repost:
          type: boolean
        original:
          $ref: '#/components/schemas/PostBase'
          description: Only for quotes; recursive live original, maximum four reference edges. Access is rechecked for
            every ancestor.
        comment_count:
          type: integer
          minimum: 0
        repost_count:
          type: integer
          minimum: 0
        my_repost:
          oneOf:
          - type: 'null'
          - type: object
            properties:
              id:
                type: string
                format: uuid
              version:
                type: integer
                minimum: 1
            required:
            - id
            - version
        reposted_by:
          type: array
          maxItems: 3
          items:
            type: object
            properties:
              repost_id:
                type: string
                format: uuid
              author_id:
                type: string
                format: uuid
              username:
                type: string
              created_at:
                type: string
                format: date-time
            required:
            - repost_id
            - author_id
            - username
            - created_at
        author_relationship: {$ref: '#/components/schemas/FollowState'}
    DirectPost:
      allOf:
      - {$ref: '#/components/schemas/Post'}
      - type: object
        required: [delivery_id, delivery_expires_at, less_similar]
        properties:
          delivery_id: {type: string, format: uuid}
          delivery_expires_at: {type: string, format: date-time}
          less_similar: {type: boolean}
    Photo:
      type: object
      required: [id, bucket, path, thumbnail_path, width, height, bytes, sha256, mime]
      properties:
        id: {type: string, format: uuid}
        bucket: {type: string, const: feed-media}
        path: {type: string}
        thumbnail_path: {type: string}
        width: {type: integer, minimum: 1, maximum: 2048}
        height: {type: integer, minimum: 1, maximum: 2048}
        bytes: {type: integer, minimum: 1, maximum: 5242880}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        mime: {type: string, const: image/jpeg}
      description: Use Storage authenticated download with the current account JWT. No public/signed URLs. Full
        image max edge 2048, preview 512. Immutable paths identify cached bytes; purge account-scoped cache after
        logout/access revocation.
    PhotoStatus:
      type: object
      required: [id, slot, state, failure_code]
      properties:
        id: {type: string, format: uuid}
        slot: {type: integer, minimum: 0, maximum: 2}
        state:
          type: string
          enum: [waiting, queued, processing, ready, attached, rejected, failed, cancelled, discarded, expired]
        failure_code:
          type: [string, 'null']
          enum: [invalid_image, processing_failed, null]
    PhotoReservation:
      allOf:
      - {$ref: '#/components/schemas/PhotoStatus'}
      - type: object
        required: [post_id, bucket, path, expires_at, max_bytes, upload_upsert]
        properties:
          post_id: {type: string, format: uuid}
          bucket: {type: string, const: feed-uploads}
          path: {type: string}
          expires_at: {type: string, format: date-time}
          max_bytes: {type: integer, const: 5242880}
          upload_upsert: {type: boolean, const: false}
    DraftStatus:
      type: object
      required: [post_id, photos, expires_at, cancelled, published, state]
      properties:
        post_id: {type: string, format: uuid}
        state: {type: string, enum: [active, published, cancelled, expired]}
        photos:
          type: array
          maxItems: 3
          items: {$ref: '#/components/schemas/PhotoStatus'}
        expires_at: {type: string, format: date-time}
        cancelled: {type: boolean}
        published: {type: boolean}
    CommentAuthor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type:
          - string
          - 'null'
      required:
      - id
      - username
      - display_name
    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        post_id:
          type: string
          format: uuid
        root_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        post_version:
          type: integer
          minimum: 1
        action_version:
          type: integer
          minimum: 0
        text:
          type:
          - string
          - 'null'
          maxLength: 200
        author:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CommentAuthor'
        state:
          type: string
          enum:
          - active
          - deleted
          - unavailable
        reply_to:
          oneOf:
          - type: 'null'
          - type: object
            properties:
              comment_id:
                type: string
                format: uuid
              user_id:
                type: string
                format: uuid
              username:
                type: string
            required:
            - comment_id
            - user_id
            - username
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        like_count:
          type: integer
          minimum: 0
        reply_count:
          type: integer
          minimum: 0
        liked:
          type: boolean
      required:
      - id
      - post_id
      - root_id
      - version
      - post_version
      - action_version
      - text
      - author
      - state
      - reply_to
      - created_at
      - updated_at
      - like_count
      - reply_count
      - liked
      description: 'Flat thread: root_id groups replies; reply_to supplies the addressed username without embedding
        it in text. Tombstones keep IDs and replies but mask text/author. Use version for edits, action_version for
        likes and post_version for the observed parent.'
    SocialCursor:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        after_position:
          type: integer
          minimum: 0
      required:
      - session_id
      - after_position
    CommentPage:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        has_more:
          type: boolean
        next_cursor:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SocialCursor'
        post_id:
          type: string
          format: uuid
        root_id:
          oneOf:
          - type: 'null'
          - type: string
            format: uuid
        sort:
          type: string
          enum:
          - popular
          - old
          - new
        items:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/Comment'
      required:
      - session_id
      - expires_at
      - has_more
      - next_cursor
      - post_id
      - root_id
      - sort
      - items
    FriendsPage:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        has_more:
          type: boolean
        next_cursor:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SocialCursor'
        items:
          type: array
          maxItems: 30
          items:
            type: object
            properties:
              position:
                type: integer
                minimum: 0
              delivery_id:
                type: string
                format: uuid
              delivery_expires_at:
                type: string
                format: date-time
              post:
                $ref: '#/components/schemas/Post'
            required:
            - position
            - delivery_id
            - delivery_expires_at
            - post
      required:
      - session_id
      - expires_at
      - has_more
      - next_cursor
      - items
    NearbyPage:
      allOf:
      - {$ref: '#/components/schemas/FriendsPage'}
      - type: object
        required: [radius_km]
        properties:
          radius_km: {type: integer, minimum: 1, maximum: 50}
    CommentMutation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        deleted:
          type: boolean
        replayed:
          type: boolean
      required:
      - id
      - request_id
      - version
      - deleted
      - replayed
    CommentReaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        action_version:
          type: integer
          minimum: 1
        liked:
          type: boolean
        changed:
          type: boolean
        replayed:
          type: boolean
      required:
      - id
      - request_id
      - action_version
      - liked
      - changed
      - replayed
    RepostResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        post_id:
          oneOf:
          - type: 'null'
          - type: string
            format: uuid
        original_post_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        is_quote:
          type: boolean
      required:
      - id
      - post_id
      - original_post_id
      - version
      - created_at
      - is_quote
    ReportResult:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
        target_type:
          type: string
          enum:
          - post
          - comment
        target_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        replayed:
          type: boolean
      required:
      - request_id
      - target_type
      - target_id
      - created_at
      - replayed
    FollowState:
      type: object
      required:
      - author_id
      - following
      - version
      - can_follow
      - is_friend
      properties:
        author_id:
          type: string
          format: uuid
        following:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 0
        can_follow:
          type: boolean
        is_friend:
          type: boolean
      description: Caller-owned follow intent and action version. Following never grants friendship, precise coordinates
        or friends-only posts. A banned target may retain following=true while can_follow=false; unfollow remains
        possible.
    FollowResult:
      type: object
      required:
      - request_id
      - author_id
      - following
      - version
      - changed
      - replayed
      properties:
        request_id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        following:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 1
        changed:
          type: boolean
        replayed:
          type: boolean
    FollowPage:
      type: object
      required:
      - user_id
      - items
      - has_more
      - next_cursor
      properties:
        user_id:
          type: string
          format: uuid
        items:
          type: array
          maxItems: 100
          items:
            type: object
            required:
            - user
            - followed_at
            - relationship
            properties:
              user:
                $ref: '#/components/schemas/CommentAuthor'
              followed_at:
                type: string
                format: date-time
              relationship:
                $ref: '#/components/schemas/FollowState'
        has_more:
          type: boolean
        next_cursor:
          oneOf:
          - type: 'null'
          - type: object
            required:
            - requested_user
            - after_user
            properties:
              requested_user:
                type: string
                format: uuid
              after_user:
                type: string
                format: uuid
      description: Lists are public to authenticated active accounts. Owner and entries are rechecked for blocks,
        bans and deletion. UUID ascending keyset, no unbounded total count. relationship describes the caller relative
        to that row user; followed_at describes the listed relation. Do not mix cursors between owners or directions.
